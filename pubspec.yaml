name: cosmic_coach
description: Cosmic Coach — Vedic astrology daily life coach (Flutter client).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management — Riverpod primary; Bloc ONLY for chat/voice streams.
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  flutter_bloc: ^8.1.6

  # Navigation
  go_router: ^14.2.0

  # Networking (REST + SSE streaming from the FastAPI backend)
  dio: ^5.5.0

  # Firebase (auth tokens for the backend, FCM push)
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  firebase_messaging: ^15.0.4
  google_sign_in: ^6.2.1

  # UI
  google_fonts: ^6.2.1   # Outfit + Noto Serif Devanagari

  # Voice — on-device speech-to-text (transcript goes to the chat API)
  speech_to_text: ^7.0.0

  # Opens the Google Calendar OAuth consent page in the browser
  url_launcher: ^6.3.0

  # Observability
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

  # Regenerates android/ and ios/ launcher icons from assets/icon/app_icon.png.
  # Run `dart run flutter_launcher_icons` after replacing that source image
  # (e.g. once a professional Om icon asset exists) -- the platform icon
  # files in this repo were generated by resizing that same source directly
  # (no Flutter SDK in the sandbox that made this commit), so the config
  # below reproduces them exactly and is the supported way to update them.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  # iOS rejects alpha-transparent icons; match the icon's own background so
  # there's no visible seam if this doesn't cover the full canvas.
  remove_alpha_ios: true
  background_color_ios: "#05040A"
