name: cosmic_coach
description: Cosmic Coach — Vedic astrology daily life coach (Flutter client).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management — Riverpod primary; Bloc ONLY for chat/voice streams.
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  flutter_bloc: ^8.1.6

  # Navigation
  go_router: ^14.2.0

  # Networking (REST + SSE streaming from the FastAPI backend)
  dio: ^5.5.0

  # Firebase (auth tokens for the backend, FCM push)
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  firebase_messaging: ^15.0.4
  google_sign_in: ^6.2.1

  # UI
  google_fonts: ^6.2.1   # Outfit + Noto Serif Devanagari

  # Voice — on-device speech-to-text (transcript goes to the chat API)
  speech_to_text: ^7.0.0

  # Opens the Google Calendar OAuth consent page in the browser
  url_launcher: ^6.3.0

  # On-device geocoding: birth place name -> lat/lon (accuracy of the
  # chart depends on real coordinates, not hand-typed guesses)
  geocoding: ^3.0.0

  # Observability
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

  # Regenerates android/ and ios/ launcher icons from assets/icon/app_icon.png.
  # Run `dart run flutter_launcher_icons` after replacing that source image.
  flutter_launcher_icons: ^0.14.1

  # Generates the native (OS-level) launch screen from assets/splash/ below.
  # Run `dart run flutter_native_splash:create` after editing that config or
  # swapping the source images -- native splash screens are static (no
  # animation), so this covers the brief moment before Flutter's first frame;
  # the animated version lives at lib/features/splash/view/splash_screen.dart.
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/splash/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  # iOS rejects alpha-transparent icons; match the icon's own background so
  # there's no visible seam if this doesn't cover the full canvas.
  remove_alpha_ios: true
  background_color_ios: "#0B0819"
  # Android 8+ adaptive icon, from the brand asset pack (flutter_assets).
  adaptive_icon_background: "#0B0819"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground_432.png"

flutter_native_splash:
  # Config from the brand asset pack (flutter_assets/pubspec_snippet.yaml):
  # deep-space solid color + transparent radiant-Om logo.
  color: "#0B0819"
  image: assets/splash/splash_logo_1024.png
  android_12:
    color: "#0B0819"
    image: assets/splash/splash_logo_512.png
  android: true
  ios: true
